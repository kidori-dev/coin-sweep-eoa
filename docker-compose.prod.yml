# 운영용: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: UTC
    volumes:
      # PG18 이미지는 PGDATA 가 /var/lib/postgresql/18/docker 로 바뀌었다.
      # 버전 디렉터리를 감싸는 상위 경로를 마운트해야 데이터가 유지된다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: production
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    # 마이그레이션은 배포 파이프라인에서 한 번만 실행한다:
    #   docker compose -f docker-compose.prod.yml run --rm api npm run migration:run:prod

volumes:
  pgdata:
